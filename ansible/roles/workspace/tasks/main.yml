- name: Ensure workspace directory exists
  ansible.builtin.file:
    path: "{{ workspace_dir }}"
    state: directory
    mode: '0755'

- name: Git clone or pull dex repositories
  ansible.builtin.git:
    repo: "{{ github_org }}/{{ item }}.git"
    dest: "{{ workspace_dir }}/{{ item }}"
    version: HEAD
    update: yes
    accept_hostkey: yes
  loop: "{{ dex_repositories }}"
  